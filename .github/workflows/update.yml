name: Update Internship Tracker

on:
  schedule:
    # Every Monday and Thursday at 13:00 UTC (~9am ET)
    - cron: "0 13 * * 1,4"
  workflow_dispatch: {}   # lets you click "Run workflow" manually on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "internship-tracker-bot"
          git config user.email "actions@github.com"
          git add data/tracker.db docs/data.json
          git diff --staged --quiet || git commit -m "Update internship data — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
