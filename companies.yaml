# =============================================================================
# COMPANIES TO TRACK
# =============================================================================
# ats: greenhouse | lever | workday
# token: the board token / tenant slug. For most of these I could NOT verify
#        the exact token live (no internet access while building this), so
#        treat every entry as "best guess" until the dashboard shows it
#        connecting successfully. See README.md > "Fixing a broken company"
#        for how to find the correct token in under a minute.
#
# HOW TO FIND A TOKEN YOURSELF:
#   Greenhouse -> visit the company's "careers" link. If it redirects to
#     boards.greenhouse.io/SOMETHING, "SOMETHING" is the token.
#   Lever -> if it redirects to jobs.lever.co/SOMETHING, "SOMETHING" is the token.
#   Workday -> the URL looks like https://SOMECOMPANY.wd5.myworkdayjobs.com/en-US/SITENAME
#     tenant = SOMECOMPANY, site = SITENAME (site is often "Careers" or similar)
# =============================================================================

