# =============================================================================
# KEYWORDS
# Matched case-insensitively against job titles.
# A job can match both lists (e.g. "Translational Strategy") -- that's fine,
# it'll just get tagged with both categories.
#
# Anything with "intern" or "co-op" in the title that does NOT match one of
# these specific phrases still shows up on the dashboard, tagged "general" --
# see pipeline.py's classify() fallback. That's deliberate: rather than
# silently dropping postings whose wording doesn't match your list, you get
# to eyeball them yourself and decide if they're relevant. If you keep
# seeing the same kind of role land in "general" that you DO want tracked
# properly, add its phrasing here.
# =============================================================================
 
business_track:
  - "business development"
  - " bd intern"
  - "corporate development"
  - "commercial strategy"
  - "commercial operations"
  - "commercial excellence"
  - "commercial insights"
  - "market access"
  - "market research"
  - "competitive intelligence"
  - "portfolio strategy"
  - "product strategy"
  - "strategic planning"
  - "corporate strategy"
  - "strategy intern"
  - "insights intern"
  - "analytics intern"
  - "equity research"
  - "venture"
  - "life sciences consulting"
  - "strategy consulting"
  - "business analyst"
  - "strategic finance"
  - "finance intern"
  - "investment analyst"
  - "biotech investing"
  - "healthcare investing"
 
technical_track:
  - "research intern"
  - "research associate intern"
  - "lab intern"
  - "laboratory intern"
  - "clinical operations intern"
  - "clinical research intern"
  - "process development intern"
  - "process engineering intern"
  - "manufacturing intern"
  - "manufacturing science intern"
  - "analytical development intern"
  - "formulation intern"
  - "assay development intern"
  - "cell culture intern"
  - "quality assurance intern"
  - "quality control intern"
  - "regulatory affairs intern"
  - "bioengineering intern"
  - "biomedical engineering intern"
  - "r&d intern"
  - "translational"
  - "drug discovery intern"
  - "cell therapy intern"
  - "gene therapy intern"
 
# Titles containing any of these get auto-excluded even if another keyword
# matches (cuts down on false positives like "Business Development
# Representative" for unrelated SaaS sales orgs, or senior/non-intern roles).
exclude_if_contains:
  - "senior"
  - "director"
  - "principal"
  - "vice president"
  - " vp "
  - "head of"
  - "manager, "
  - "phd"
  - "postdoctoral"
